<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Borla verification code</title>
  </head>
  <body style="margin:0;background:#f5f7f2;color:#1f2937;font-family:Arial,Helvetica,sans-serif">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">Your Borla one-time verification code.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7f2">
      <tr><td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden">
          <tr><td style="padding:24px 32px;background:#f9b000;color:#111827;font-size:26px;font-weight:700">Borla</td></tr>
          <tr><td style="padding:36px 32px">
            <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3;color:#111827">Your verification code</h1>
            <p style="margin:0 0 24px;font-size:16px;line-height:1.6">Use this code to verify <strong>{{email}}</strong>.</p>
            <div style="padding:20px;text-align:center;background:#fff8e1;border:1px solid #f9b000;border-radius:12px">
              <div style="margin-bottom:8px;color:#6b7280;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase">One-time code</div>
              <div style="color:#111827;font-size:34px;font-weight:700;letter-spacing:8px">{{otp}}</div>
            </div>
            <p style="margin:24px 0 0;color:#4b5563;font-size:14px;line-height:1.6">This code expires in 3 minutes. Do not share it with anyone. If you did not request it, you can ignore this email.</p>
          </td></tr>
          <tr><td align="center" style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px">Automated verification message from Borla.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
