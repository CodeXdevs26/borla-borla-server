<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Borla zone assignment</title>
  </head>
  <body style="margin:0;background:#f5f7f2;color:#1f2937;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7f2">
      <tr><td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden">
          <tr><td style="padding:24px 32px;background:#f9b000;color:#111827;font-size:26px;font-weight:700">Borla</td></tr>
          <tr><td style="padding:36px 32px">
            <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3;color:#111827">You have been assigned to a zone</h1>
            <p style="margin:0 0 14px;font-size:16px;line-height:1.6">Hello {{name}},</p>
            <p style="margin:0 0 20px;font-size:16px;line-height:1.6">Your Borla rider account has been assigned to:</p>
            <div style="padding:18px 20px;background:#fff8e1;border-left:4px solid #f9b000;border-radius:8px;color:#111827;font-size:20px;font-weight:700">{{zoneName}}</div>
            <p style="margin:20px 0 0;color:#4b5563;font-size:14px;line-height:1.6">Sign in to the app to view your assignment and available work.</p>
          </td></tr>
          <tr><td align="center" style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px">Assignment notification from Borla.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
