<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Borla rider account is approved</title>
  </head>
  <body style="margin:0;background:#f5f7f2;color:#1f2937;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7f2">
      <tr><td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden">
          <tr><td style="padding:24px 32px;background:#f9b000;color:#111827;font-size:26px;font-weight:700">Borla</td></tr>
          <tr><td style="padding:36px 32px">
            <div style="margin-bottom:18px;font-size:40px;line-height:1">&#10003;</div>
            <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3;color:#111827">Rider verification approved</h1>
            <p style="margin:0 0 14px;font-size:16px;line-height:1.6">Hello {{name}},</p>
            <p style="margin:0;font-size:16px;line-height:1.6">Your rider verification has been approved. You can now sign in to Borla and use the rider features available to your account.</p>
          </td></tr>
          <tr><td align="center" style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px">Account notification from Borla.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
