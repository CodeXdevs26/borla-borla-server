<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Borla support message</title>
  </head>
  <body style="margin:0;background:#f5f7f2;color:#1f2937;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7f2">
      <tr><td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden">
          <tr><td style="padding:24px 32px;background:#f9b000;color:#111827;font-size:26px;font-weight:700">Borla Support</td></tr>
          <tr><td style="padding:36px 32px">
            <h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;color:#111827">Support message received</h1>
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="font-size:15px;line-height:1.6">
              <tr><td style="padding:8px 12px;color:#6b7280;width:110px">Name</td><td style="padding:8px 12px;font-weight:700">{{name}}</td></tr>
              <tr><td style="padding:8px 12px;color:#6b7280">Email</td><td style="padding:8px 12px">{{email}}</td></tr>
              <tr><td style="padding:8px 12px;color:#6b7280">Phone</td><td style="padding:8px 12px">{{phoneNumber}}</td></tr>
            </table>
            <div style="margin-top:20px;padding:18px 20px;background:#f9fafb;border-left:4px solid #f9b000;border-radius:8px;font-size:15px;line-height:1.7;white-space:pre-wrap">{{message}}</div>
          </td></tr>
          <tr><td align="center" style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px">Support notification from Borla.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
